apiVersion: v1
kind: Pod
metadata:
  name: mem-evict-1
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "600M", "--vm-hang", "1"]
      resources:
        requests:
          cpu: 200m
          memory: 700Mi
        limits:
          cpu: 200m
          memory: 700Mi
