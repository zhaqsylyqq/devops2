---
- name: Bootstrap GitOps Cluster with ArgoCD
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create ArgoCD namespace (if not exists)
      shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      register: ns_creation
      changed_when: "'created' in ns_creation.stdout"

    - name: Install ArgoCD from official manifest
      command: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml --server-side
      register: argo_install
      changed_when: "'created' in argo_install.stdout or 'configured' in argo_install.stdout"

    - name: Wait for ArgoCD server pods to be ready
      command: kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s
      changed_when: false

    - name: Deploy the Root App of Apps (The Magic Button)
      command: kubectl apply -f argocd/root-app.yaml
      register: root_app
      changed_when: "'created' in root_app.stdout or 'configured' in root_app.stdout"

    - name: Print success message
      debug:
        msg: "✅ GitOps workflow initiated! ArgoCD is now pulling your infrastructure from Git."
